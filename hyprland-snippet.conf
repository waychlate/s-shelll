# Add to ~/.config/hypr/hyprland.conf (adjust the path if you move the project)

# start the shell with Hyprland
exec-once = qs -p ~/projects/personal/shadow-shell

# open / close the launcher
bind = SUPER, SPACE, exec, qs -p ~/projects/personal/shadow-shell ipc call launcher toggle

# frosted-glass blur behind the launcher (namespace: shadow-launcher) and the bar (shadow-bar).
# Hyprland changed this syntax between versions, so use whichever your version accepts
# (see the Hyprland wiki, "Layer Rules"):
#   newer:
#     layerrule = blur on, match:namespace shadow-launcher
#     layerrule = ignore_alpha 0.1, match:namespace shadow-launcher
#     layerrule = blur on, match:namespace shadow-bar
#     layerrule = ignore_alpha 0.1, match:namespace shadow-bar
#   older:
#     layerrule = blur, shadow-launcher
#     layerrule = ignorealpha 0.1, shadow-launcher
#     layerrule = blur, shadow-bar
#     layerrule = ignorealpha 0.1, shadow-bar
